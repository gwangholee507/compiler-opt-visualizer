name: Release

# v로 시작하는 태그(예: v0.1.0)를 push하면, 프론트엔드까지 넣은 실행 가능한 jar를 만들어
# GitHub Release에 첨부한다. 사용자는 이 jar 하나만 내려받아 `java -jar`로 실행하면 된다.
#
# 수동 실행(workflow_dispatch)으로도 돌릴 수 있다. 이때는 Release를 만들지 않고 jar만
# 워크플로 아티팩트로 올리므로, 태그를 찍기 전에 릴리스 빌드를 미리 확인해볼 수 있다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # GitHub Release 생성에 필요

jobs:
  release:
    name: Build and publish jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # 테스트와 스모크 테스트가 실제 컴파일러를 호출한다
      - name: Install clang and gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc

      # 태그 v1.2.3 → 버전 1.2.3. 태그 없이 수동 실행한 경우에는 커밋 해시로 구분한다.
      - name: Decide version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # 이 값은 아래 단계의 명령과 파일 이름에 그대로 들어가므로 형식을 엄격하게 확인한다
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "태그는 v1.2.3 또는 v1.2.3-rc.1 형식이어야 합니다: $GITHUB_REF_NAME"
              exit 1
            fi
            echo "value=$version" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # 테스트까지 통과해야 jar가 만들어진다
      - name: Build runnable jar (with frontend)
        run: ./mvnw -B -Pbundle -Drevision=${{ steps.version.outputs.value }} package

      - name: Smoke test the jar
        run: bash ../.github/scripts/smoke-test.sh target/compiler-opt-visualizer-${{ steps.version.outputs.value }}.jar

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-opt-visualizer-${{ steps.version.outputs.value }}
          path: backend/target/compiler-opt-visualizer-${{ steps.version.outputs.value }}.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "target/compiler-opt-visualizer-${{ steps.version.outputs.value }}.jar" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

name: CI

# main에 push되거나, main을 대상으로 하는 PR이 열릴 때마다 백엔드/프론트엔드를 각각 빌드+테스트한다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # pom.xml의 <java.version>17</java.version>과 맞춤
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # CompilerService가 clang을 서브프로세스로 호출하므로 CI 러너에도 설치해야 한다
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Run tests
        run: mvn -B test

      - name: Build jar
        run: mvn -B -DskipTests package

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
